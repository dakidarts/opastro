name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate and publish, for example v0.1.8"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tooling
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          python -m pip install -e ".[dev]"

      - name: Validate Tag Matches Package Version
        run: |
          python - <<'PY'
          import configparser
          import os
          import re

          release_tag = os.getenv("RELEASE_TAG", "")
          match = re.fullmatch(r"v(.+)", release_tag)
          if not match:
              raise SystemExit(f"Expected a v-prefixed release tag, got: {release_tag}")
          tag_version = match.group(1)

          cfg = configparser.ConfigParser()
          cfg.read("setup.cfg", encoding="utf-8")
          package_version = cfg.get("metadata", "version", fallback="").strip()
          if not package_version:
              raise SystemExit("Could not read metadata.version from setup.cfg")
          if tag_version != package_version:
              raise SystemExit(
                  f"Tag version mismatch: tag=v{tag_version}, setup.cfg={package_version}"
              )
          print(f"Tag/version validated: v{tag_version}")
          PY

      - name: Run Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run Tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Dependency Audit
        run: python -m pip_audit --local

      - name: Build Distributions
        run: python -m build

      - name: Twine Check
        run: python -m twine check dist/*

      - name: Verify Built Artifacts
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")
          source = glob.glob("dist/*.tar.gz")
          if len(wheel) != 1 or len(source) != 1:
              raise SystemExit("Expected exactly one wheel and one sdist")
          required = {"seas_18.se1", "s136199s.se1"}
          with zipfile.ZipFile(wheel[0]) as archive:
              names = set(archive.namelist())
          with tarfile.open(source[0], "r:gz") as archive:
              names.update(member.name for member in archive.getmembers())
          missing = {
              filename
              for filename in required
              if not any(name.endswith(filename) for name in names)
          }
          if missing:
              raise SystemExit(f"Missing packaged ephemeris files: {sorted(missing)}")
          print("Packaged ephemeris files verified")
          PY

      - name: Installed Wheel Smoke Test
        run: |
          python -m venv /tmp/opastro-wheel-smoke
          /tmp/opastro-wheel-smoke/bin/python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          /tmp/opastro-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/opastro-wheel-smoke/bin/python -c "import opastro; assert opastro.__version__"

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opastro-dist-${{ github.ref_name }}
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
