name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
      - name: Dependency Audit
        run: python -m pip_audit --local
